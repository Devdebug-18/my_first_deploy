<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>job website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="applybox">
        <h1>Job Application <span class="title-small">(web)</span></h1>
        <form action="">
            <div class="form-container">
            <div class="form-controler">
              <label for="firstname">firstname</label>
              <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="enter first name"
              />
            </div>
            <div class="form-controler">
              <label for="lastname">lastname</label>
              <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="enter lastname name"
              />
            </div>
            <div class="form-controler">
                <label for="email">email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="enter lastname name"
                />
              </div>
              <div class="form-controler">
                <label for="job role">jobrole</label>
                <select id="jobrole" name="jobrole">
                    <option value="frontend">frontend</option>
                    <option value="backend">backend</option>
                    <option value="full-stack">full-stack</option>
                    <option value="software-developer">software-developer</option>
                    <option value="data-science">data-science</option>
                </select>
              </div>
              <div class="form-controler">
                <label for="adress">adress</label>
                <textarea
                  id="adress"
                  name="adress"
                 row="4" cols="30"
                  placeholder="enter your adress">enter your adress</textarea>
              </div>
              <div class="form-controler">
                <label for="city">city</label>
                <input
                  type="city"
                  id="city"
                  name="city"
                 placeholder="enter your city"
                />
              </div>
              <div class="form-controler">
                <label for="pincode">pincode</label>
                <input
                  type="number"
                  id="pincode"
                  name="pincode"
                  placeholder="enter pincode"
                />
              </div>
              <div class="form-controler">
                <label for="date">date</label>
                <input
                  type="date"
                  id="date"
                  name="date"
                  placeholder="enter date"
                />
              </div>
              <div class="form-controler">
                <label for="upload">upload your resume</label>
                <input
                  type="file"
                  id="upload"
                  name="upload"
                  placeholder="upload your resume"
                />
              </div>
      </div>
      <div class="btn-container">
        <button type="submit">apply now</button>
    </div>
    </div>
    
        </form>
    </div>
  </body>
</html>
